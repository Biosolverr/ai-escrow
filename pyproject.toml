[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-escrow"
version = "1.0.0"
description = "AI-powered freelance escrow with multi-LLM dispute resolution"
readme = "README.md"
requires-python = ">=3.11"

dependencies = []
# Contract runtime deps are declared in ai_escrow.py's own
# `# { "Depends": ... }` header and resolved by GenVM at deploy time,
# not via pip.

[project.optional-dependencies]
dev = [
    "genlayer-test>=0.1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["contracts*", "scripts*"]
